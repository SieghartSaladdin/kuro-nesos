[package]
name = "kuro-nesos"
version = "1.2.0"
edition = "2021"
description = "Kuro Nesos - a living notch for Windows"
license = "MIT"
repository = "https://github.com/SieghartSaladdin/kuro-nesos"
readme = "README.md"

[dependencies]
windows-core = "0.58"

[build-dependencies]
embed-resource = "2.5"

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "ApplicationModel",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Globalization",
  "Media_Control",
  "Networking_Connectivity",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
